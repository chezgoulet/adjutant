name: CI

on:
  push:
    # House git flow: testing = integration target, main = releases.
    branches: [testing, main, "feature/*", "fix/*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: adjutant
          POSTGRES_PASSWORD: adjutant
          POSTGRES_DB: adjutant_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adjutant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ADJUTANT_DATABASE_URL: postgres://adjutant:adjutant@127.0.0.1:5432/adjutant_dev
      ADJUTANT_TEST_DATABASE_URL: postgres://adjutant:adjutant@127.0.0.1:5432/adjutant_dev_test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      # The DB-backed tests connect to this database and fail loudly if it is
      # missing (that is how the first CI run after the M3 merge went red).
      - name: Create the test database
        run: psql "$ADJUTANT_DATABASE_URL" -c 'CREATE DATABASE adjutant_dev_test'

      - name: Build
        run: cargo build --workspace

      # The gate the milestone docs quote: 0 warnings, in CI, on every push.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Docs build must be warning-free (broken intra-doc links fail here).
      - name: Docs (warnings are errors)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      # Advisories, licenses, bans, and sources (config: deny.toml).
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Unit + integration tests
        run: cargo test --workspace

      # These skip themselves without ADJUTANT_TEST_DATABASE_URL; here it is set,
      # so they must actually run.
      - name: DB-backed host tests
        run: cargo test -p adjutant-server --test host_db -- --nocapture

      # Live evidence: the committed ladder resets the database, boots its own
      # server and writes docs/evidence/m2_probes.json. A failure here means the
      # milestone document's numbers are stale.
      - name: Live probe ladder (M1 + M2)
        run: python3 scripts/probes.py

      - name: Stage plugins
        run: |
          mkdir -p plugins-built
          cp target/debug/libadjutant_hello.so \
             target/debug/libadjutant_auth.so \
             target/debug/libadjutant_membership.so plugins-built/

      # Route/registry smoke ladder against a pristine test database.
      - name: test-plugin harness
        run: ADJUTANT_PLUGIN_DIR=plugins-built ./target/debug/adjutant test-plugin

      # The sandboxed path: build the WASM guest and load it through the same
      # registry/dispatch pipeline (a separate plugin dir keeps the native
      # harnesses above unaffected).
      - name: Build the WASM guest
        run: cargo build --manifest-path wasm/Cargo.toml --release --target wasm32-wasip1

      - name: WASM guest loads and serves (test-plugin)
        run: |
          mkdir -p wasm-built
          cp wasm/target/wasm32-wasip1/release/adjutant_hello_wasm.wasm wasm-built/
          ADJUTANT_PLUGIN_DIR=wasm-built ./target/debug/adjutant test-plugin

      # End-to-end, with the spoofable dev-header stub OFF. The harness asserts
      # that precondition itself (probe 0) and exercises a mock OIDC provider.
      # `adjutant new-plugin` output must compile — the unit test only checks
      # the generated strings, which is how a broken scaffold could ship.
      # CI checkouts are disposable, so mutating the workspace here is fine.
      - name: Scaffolder output compiles
        run: |
          ./target/debug/adjutant new-plugin gear_locker
          cargo build -p adjutant-gear_locker

      # The fresh-machine proxy: a plugin produced only by `new-plugin` must load
      # into a real server and answer its routes under the permission gate.
      - name: Freshly scaffolded plugin loads and serves
        run: |
          mkdir -p fresh-built
          cp target/debug/libadjutant_gear_locker.so fresh-built/
          ADJUTANT_PLUGIN_DIR=fresh-built ./target/debug/adjutant test-plugin

      # Static validation: ABI handshake, init against in-memory mocks, and the
      # manifest rules — no database and no server. Proves the scaffold passes
      # the same gate a third-party plugin would.
      - name: validate-plugin (static, no DB)
        run: |
          ./target/debug/adjutant validate-plugin target/debug/libadjutant_hello.so
          ./target/debug/adjutant validate-plugin target/debug/libadjutant_auth.so
          ./target/debug/adjutant validate-plugin target/debug/libadjutant_membership.so
          ./target/debug/adjutant validate-plugin target/debug/libadjutant_gear_locker.so

      - name: End-to-end harness (dev headers OFF)
        run: |
          ADJUTANT_PLUGIN_DIR=plugins-built \
          ADJUTANT_DEV_HEADERS=false \
          ADJUTANT_RATE_MAX=0 \
          ADJUTANT_LOG=warn \
            ./target/debug/adjutant &
          for _ in $(seq 1 100); do
            if python3 -c "import socket,sys; socket.create_connection(('127.0.0.1',8787),1); sys.exit(0)" 2>/dev/null; then break; fi
            sleep 0.2
          done
          python3 docs/e2e_m3.py

  # The declared MSRV (workspace rust-version). RUSTUP_TOOLCHAIN overrides the
  # rust-toolchain.toml `stable` channel so this job actually uses 1.96.
  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo check on MSRV
        run: cargo check --workspace
