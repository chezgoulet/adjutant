[package]
name = "adjutant-finance"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Finance: funds, transactions, budgets vs actuals, and sliding-scale dues (SPEC 7.5)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
adjutant-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

[dev-dependencies]
tokio.workspace = true
# A **dev**-dependency only: it links into the test binaries, never into the
# cdylib, so the plugin's no-runtime-in-the-plugin rule (a plugin reaches the
# database through `ctx.db`, never through sqlx) is untouched. The DB-backed
# probes connect to a real PostgreSQL as this plugin's own role and drive the
# real route handlers, so what they prove is what the *plugin's* statements do.
sqlx.workspace = true
