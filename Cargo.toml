[workspace]
resolver = "2"
members = [
    "plugins/sdk",
    "plugins/auth",
    "plugins/membership",
    "plugins/examples/hello",
    "server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/chezgoulet/adjutant"

[workspace.dependencies]
adjutant-sdk = { path = "plugins/sdk" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "macros", "chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", features = ["cors"] }
toml = "0.9"

[profile.dev]
debug = 0  # keep compile times sane for the prototype loop
