name: CI

on:
  push:
    # House git flow: testing = integration target, main = releases.
    branches: [testing, main, "feature/*", "fix/*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: adjutant
          POSTGRES_PASSWORD: adjutant
          POSTGRES_DB: adjutant_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adjutant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ADJUTANT_DATABASE_URL: postgres://adjutant:adjutant@127.0.0.1:5432/adjutant_dev
      ADJUTANT_TEST_DATABASE_URL: postgres://adjutant:adjutant@127.0.0.1:5432/adjutant_dev_test
      # CI's Postgres service user IS a superuser. The server refuses to boot on
      # one (a plugin escape would be total compromise), so the throwaway CI
      # database opts out explicitly. The refusal itself is covered by a unit
      # test, not by CI.
      ADJUTANT_ALLOW_SUPERUSER: "true"
    steps:
      - uses: actions/checkout@v4

      # The toolchain version lives in exactly one place. `dtolnay/rust-toolchain@stable`
      # does NOT read rust-toolchain.toml, so it floated forward while local stable
      # lagged — which is how a clippy lint new in 1.98 passed here and failed CI.
      - name: Read the pinned toolchain
        id: toolchain
        run: echo "channel=$(grep -oP '^channel\s*=\s*"\K[^"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      # Make toolchain drift visible in the log instead of mysterious.
      - name: Toolchain version
        run: rustc --version && cargo clippy --version

      # The DB-backed tests connect to this database and fail loudly if it is
      # missing (that is how the first CI run after the M3 merge went red).
      - name: Create the test database
        run: psql "$ADJUTANT_DATABASE_URL" -c 'CREATE DATABASE adjutant_dev_test'

      - name: Build
        run: cargo build --workspace

      # The gate the milestone docs quote: 0 warnings, in CI, on every push.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Docs build must be warning-free (broken intra-doc links fail here).
      - name: Docs (warnings are errors)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      # Advisories, licenses, bans, and sources (config: deny.toml).
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Unit + integration tests
        run: cargo test --workspace

      # These are #[ignore]d so a bare `cargo test` reports them as ignored, not
      # passed (issue #25). Here the database exists, so run them explicitly and
      # fail the job if it is unavailable. `pool_lifecycle` is the #30 leak probe.
      - name: DB-backed host tests + pool lifecycle
        run: >-
          cargo test -p adjutant-server --test host_db --test pool_lifecycle
          -- --ignored --nocapture

      # Live evidence: the committed ladder resets the database, boots its own
      # server and writes docs/evidence/m2_probes.json. A failure here means the
      # milestone document's numbers are stale. It refuses any database whose
      # name does not end in _test, so point it at the test database.
      - name: Live probe ladder (M1 + M2)
        env:
          ADJUTANT_DATABASE_URL: postgres://adjutant:adjutant@127.0.0.1:5432/adjutant_dev_test
        run: python3 scripts/probes.py

      - name: Stage plugins
        # This list used to be written here by hand, and it fell behind: five
        # libraries staged against a twelve-crate workspace meant the route ladder
        # below — the only gate that catches a data-layer fault at request time —
        # never probed calendar, mcp or the M6 batch, so two routes answered 500 on
        # `testing` with CI green (#55). The set is derived now: a plugin library
        # is exactly a workspace crate that builds a cdylib.
        run: python3 scripts/stage-plugins.py

      # Route/registry smoke ladder against a pristine test database.
      - name: test-plugin harness
        run: ADJUTANT_PLUGIN_DIR=plugins-built ./target/debug/adjutant test-plugin

      # The money path's own probes: the stripe plugin's ledger booking is one
      # statement, idempotent across a redelivery, and its worklist tells the
      # truth about an in-flight intent. They are `#[ignore]`d (issue #25) so the
      # bare workspace run reports them as ignored, and they need the database the
      # ladder above has just bootstrapped — roles, the stored plugin secrets, and
      # the plugin migrations — because they connect AS the plugin's own role:
      # `core.outbox_enqueue` derives the producer from `session_user`.
      - name: Stripe outbox probes (DB-backed)
        run: cargo test -p adjutant-stripe --test outbox_intent -- --ignored --nocapture

      # The store plugin's scholarship draw on the same rail: the order's
      # completion and its draw intent are one statement (a revoked
      # `svc.store.draw` leaves the order un-transitioned), a replayed completion
      # yields one intent and the same intent id, and the worklist lists an
      # in-flight draw and drops it once the intent's durable state is delivered.
      # Same reason as the stripe step for its position and its gate: the probes
      # connect AS the plugin's own role, so they need the roles, the stored
      # secrets and the plugin migrations the ladder above has just bootstrapped.
      - name: Store outbox probes (DB-backed)
        run: cargo test -p adjutant-store --test outbox_draw -- --ignored --nocapture

      # The sandboxed path: build the WASM guest and load it through the same
      # registry/dispatch pipeline (a separate plugin dir keeps the native
      # harnesses above unaffected).
      - name: Build the WASM guest
        run: cargo build --manifest-path wasm/Cargo.toml --release --target wasm32-wasip1

      - name: WASM guest loads and serves (test-plugin)
        run: |
          mkdir -p wasm-built
          cp wasm/target/wasm32-wasip1/release/adjutant_hello_wasm.wasm wasm-built/
          ADJUTANT_PLUGIN_DIR=wasm-built ./target/debug/adjutant test-plugin

      # End-to-end, with the spoofable dev-header stub OFF. The harness asserts
      # that precondition itself (probe 0) and exercises a mock OIDC provider.
      # `adjutant new-plugin` output must compile — the unit test only checks
      # the generated strings, which is how a broken scaffold could ship.
      # CI checkouts are disposable, so mutating the workspace here is fine.
      - name: Scaffolder output compiles
        run: |
          ./target/debug/adjutant new-plugin gear_locker
          cargo build -p adjutant-gear_locker

      # The fresh-machine proxy: a plugin produced only by `new-plugin` must load
      # into a real server and answer its routes under the permission gate.
      - name: Freshly scaffolded plugin loads and serves
        run: |
          mkdir -p fresh-built
          cp target/debug/libadjutant_gear_locker.so fresh-built/
          ADJUTANT_PLUGIN_DIR=fresh-built ./target/debug/adjutant test-plugin

      # Static validation: ABI handshake, init against in-memory mocks, and the
      # manifest rules — no database and no server. Proves the scaffold passes
      # the same gate a third-party plugin would.
      - name: validate-plugin (static, no DB)
        run: |
          # Every staged library, derived for the same reason the staging is (#55).
          for so in plugins-built/*.so; do
            ./target/debug/adjutant validate-plugin "$so"
          done
          # `gear_locker` is not a workspace member and is not in `plugins-built`:
          # the step above scaffolds it at run time, so it is validated here by
          # name — that is the point of the scaffolder check, not an omission.
          ./target/debug/adjutant validate-plugin target/debug/libadjutant_gear_locker.so

      - name: End-to-end harness (dev headers OFF)
        run: |
          # Keep the harness off the live `adjutant_dev` database, like the probe ladder
          # above; `adjutant_dev_test` is created earlier in this job. The URL is read
          # from the job's ADJUTANT_TEST_DATABASE_URL rather than written out a second
          # time: a duplicated credential is one more place to get it wrong, and this
          # step's own copy once carried a redacted `***` placeholder as its password —
          # a URL that looks perfectly valid and fails authentication, which is exactly
          # why it went unnoticed for a day.
          export ADJUTANT_DATABASE_URL="$ADJUTANT_TEST_DATABASE_URL"
          # The loader runs each plugin as its own restricted DB role; create the
          # roles/credentials before boot (the runtime has no CREATEROLE).
          ./target/debug/adjutant bootstrap-isolation \
            --database-url "$ADJUTANT_DATABASE_URL" --plugin-dir plugins-built
          ADJUTANT_PLUGIN_DIR=plugins-built \
          ADJUTANT_DEV_HEADERS=false \
          ADJUTANT_RATE_MAX=0 \
          ADJUTANT_LOG=warn \
            ./target/debug/adjutant &
          for _ in $(seq 1 100); do
            if python3 -c "import socket,sys; socket.create_connection(('127.0.0.1',8787),1); sys.exit(0)" 2>/dev/null; then break; fi
            sleep 0.2
          done
          # A wait loop that gives up quietly turns a dead server into a confusing
          # network error from the harness below — a wrong database credential once
          # surfaced as 'connection refused'. Fail here instead, beside the server's
          # own output in this log.
          python3 -c "import socket,sys; socket.create_connection(('127.0.0.1',8787),1); sys.exit(0)" \
            || { echo "::error::the server never opened 127.0.0.1:8787 — see its output above"; exit 1; }
          python3 docs/e2e_m3.py

      # The domain lifecycle, live: six-stage missions (Art 8), motions and
      # votes, quorum, minutes, and Accords versioning (Art 5/9/17). A second
      # server on 8788 because these are *domain* flows — the dev-header stub is
      # the cheapest way to hold a `chief` identity for them, and M3's harness
      # above is the identity proof. Both servers share the test database; the
      # first has already applied every migration by the time this one boots.
      - name: End-to-end mission + governance lifecycle (dev headers ON)
        run: |
          # Same database as the harness above, by derivation rather than a second
          # copy of the credential.
          export ADJUTANT_DATABASE_URL="$ADJUTANT_TEST_DATABASE_URL"
          ADJUTANT_PLUGIN_DIR=plugins-built \
          ADJUTANT_DEV_HEADERS=true \
          ADJUTANT_ALLOW_SUPERUSER=true \
          ADJUTANT_RATE_MAX=0 \
          ADJUTANT_LOG=warn \
          ADJUTANT_BIND=127.0.0.1:8788 \
            ./target/debug/adjutant &
          for _ in $(seq 1 100); do
            if python3 -c "import socket,sys; socket.create_connection(('127.0.0.1',8788),1); sys.exit(0)" 2>/dev/null; then break; fi
            sleep 0.2
          done
          # A wait loop that gives up quietly turns a dead server into a confusing
          # network error from the harness below — a wrong database credential once
          # surfaced as 'connection refused'. Fail here instead, beside the server's
          # own output in this log.
          python3 -c "import socket,sys; socket.create_connection(('127.0.0.1',8788),1); sys.exit(0)" \
            || { echo "::error::the server never opened 127.0.0.1:8788 — see its output above"; exit 1; }
          ADJUTANT_E2E_BASE=http://127.0.0.1:8788 python3 docs/e2e_m4.py

  # The declared MSRV (workspace rust-version). RUSTUP_TOOLCHAIN overrides the
  # pinned rust-toolchain.toml channel so this job actually uses 1.96.
  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo check on MSRV
        run: cargo check --workspace
