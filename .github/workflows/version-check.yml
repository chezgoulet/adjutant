name: Version consistency

# #177: the tag, Cargo.toml, client/pubspec.yaml and the newest CHANGELOG
# heading were four statements of one version and nothing compared them. This
# job is the comparison, and it is deliberately separate from the heavy suites:
# it is cheap enough to run on every branch push and on a tag, and the release
# workflow runs the same script before it builds anything.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag, Cargo.toml, pubspec.yaml and CHANGELOG agree
        run: python3 scripts/check-versions.py
