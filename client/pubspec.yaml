name: adjutant_client
description: "Adjutant — sovereignty-first administration for democratic scout troops."
publish_to: 'none'

version: 0.1.0+1

# The exact Flutter SDK this app is built and gated with (issue #76). CI reads
# THIS file — `flutter-version-file` in .github/workflows/ci.yml — rather than
# following the stable channel, so a local green and the branch's gate are the
# same toolchain. That is the same reasoning as `rust-toolchain.toml` on the Rust
# side, and the same reason the value lives in a committed file instead of being
# hand-copied into two CI steps that drift apart the moment one is bumped.
#
# It has to be an exact version. The action matches the release it installs
# against this string literally, and its documentation marks a range
# (`>=3.47.5 <4.0.0`) as unsupported here.
environment:
  sdk: ^3.13.4
  flutter: 3.47.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP client — one implementation across android/ios/web/desktop.
  http: ^1.2.2

  # State management. Deliberately small: the client is a renderer for server
  # state, not an application with its own domain logic.
  provider: ^6.1.2

  # Local cache for offline-first reads and the queued-write outbox. Available
  # on every target including web.
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
