# Adjutant behind a reverse proxy — the stack that terminates TLS.
#
#   docker compose -f deploy/compose.proxy.yml up -d --build
#
# This is deliberately a **complete** stack rather than an override of
# `docker-compose.yml`. Compose concatenates `ports` across files, so an override
# cannot remove the base file's `8787:8787` — and an app reachable directly is an
# app reachable without TLS, which defeats the point. The duplication is real and
# `deploy/verify.sh` checks the two `adjutant` services have not drifted apart.
#
# Roles: identical to `docker-compose.yml` (see the comment there) — `adjutant` is
# the one-off bootstrap superuser, `adjutant_app` is the server's runtime role.
#
# One thing here is new and load-bearing: the `edge` network has a fixed subnet
# and the proxy has a **static address**, because `ADJUTANT_TRUSTED_PROXIES` is a
# literal-address comparison. See deploy/README.md.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: adjutant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: adjutant
    volumes:
      # Postgres 18 moved PGDATA into a versioned subdirectory of
      # /var/lib/postgresql, and the image refuses to start if the volume is
      # mounted at the old .../data path: it reports an "unused mount/volume" and
      # exits. Mount the parent and let the image manage its own layout.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adjutant"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]
    restart: unless-stopped

  adjutant:
    # The context is the repository root, `..`, not `.`: Compose resolves relative
    # paths against the *compose file's* directory, so `build: .` in this file
    # would look for `deploy/Dockerfile` and fail with "failed to read dockerfile"
    # — which is exactly what the first real run did.
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADJUTANT_DATABASE_URL: postgres://adjutant_app:${ADJUTANT_APP_PASSWORD:?set ADJUTANT_APP_PASSWORD}@postgres:5432/adjutant
      ADJUTANT_BIND: 0.0.0.0:8787
      ADJUTANT_LOG_FORMAT: json
      # The proxy's static address on the `edge` network. Literal string compare
      # against the direct peer: get this wrong and every client behind the proxy
      # shares one rate-limit bucket (fail-safe, but wrong). Keep it equal to the
      # `ipv4_address` below and to `PROXY_IP`.
      ADJUTANT_TRUSTED_PROXIES: ${ADJUTANT_EDGE_PREFIX:-172.31.7}.2
      # The client's origin, if the app is served from a different name than the
      # API. Same-origin only when unset.
      ADJUTANT_CORS: ${ADJUTANT_CORS:-}
      # verify.sh turns the limiter down to 1 request per 60s so its *choice of
      # key* is observable as a 200/429 without reading a log. That only works if
      # the value actually reaches the container, which is what these two do —
      # without them the app keeps its own default (120 requests / 60s, see
      # `RateConfig::default`) and a correct stack fails proof 2. Defaults are
      # written out rather than left empty: an empty string is not a number, and
      # the app refuses to boot on one.
      ADJUTANT_RATE_MAX: ${ADJUTANT_RATE_MAX:-120}
      ADJUTANT_RATE_WINDOW: ${ADJUTANT_RATE_WINDOW:-60}
      # Where the in-app backup button writes. A volume rather than the
      # container's filesystem: a bundle inside a container is lost the next
      # time the container is replaced, which is precisely when someone wants
      # it. `docs/backup-and-restore` is the host-side producer, if any.
      ADJUTANT_BACKUP_DIR: /app/backups
      # Leave ADJUTANT_DEV_HEADERS unset (off). Anyone who can reach the port can
      # claim any role when it is on.
    # NOTE: no `ports:` — the proxy is the only way in, and verify.sh checks it.
    # The bundles survive the container. Named rather than a bind mount so the
    # host path is Docker's business.
    volumes:
      - backups:/app/backups
    networks: [internal, edge]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on: [adjutant]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to the certificate name}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      UPSTREAM: adjutant:8787
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificates live here; back this up
      - caddy_config:/config
    networks:
      edge:
        # Static, because ADJUTANT_TRUSTED_PROXIES above must match it exactly.
        ipv4_address: ${ADJUTANT_EDGE_PREFIX:-172.31.7}.2
    restart: unless-stopped

  # A throwaway curl on the `edge` network, so `verify.sh` can originate requests
  # from a real client address without a second machine. Not started by `up` (it
  # is behind a profile) and it holds nothing.
  #
  # The addresses are PINNED, and there are two of them, because the obvious
  # design does not work: "two `run` invocations are two containers, therefore two
  # addresses" is false. Docker returns a freed address to the next container, so
  # four successive `run`s of one service all came up as 172.31.7.4, and proof 2
  # could not tell two clients apart. `verify.sh` now names which probe it wants.
  # The addresses are derived from ADJUTANT_EDGE_PREFIX, and so is the subnet they
  # live in — one knob, because a subnet and an address that disagree is exactly
  # the failure this file is trying to avoid. A second stack on the same host sets
  # only that: `ADJUTANT_EDGE_PREFIX=172.31.8`.
  probe:
    image: curlimages/curl:8.22.0
    profiles: ["probe"]
    entrypoint: ["sh", "-c"]
    networks:
      edge:
        ipv4_address: ${ADJUTANT_EDGE_PREFIX:-172.31.7}.4
    restart: "no"

  # The second client. Same image, different pinned address — this is what makes
  # "a second client gets its own bucket" a real assertion rather than a hope.
  probe2:
    image: curlimages/curl:8.22.0
    profiles: ["probe"]
    entrypoint: ["sh", "-c"]
    networks:
      edge:
        ipv4_address: ${ADJUTANT_EDGE_PREFIX:-172.31.7}.5
    restart: "no"

volumes:
  pgdata:
  backups:
  caddy_data:
  caddy_config:

networks:
  # The app and its database, invisible to the host.
  internal:
    internal: true
  # What the proxy is on. A fixed subnet so the static address is meaningful —
  # and it is derived from ADJUTANT_EDGE_PREFIX along with every address that has
  # to sit inside it.
  #
  # This used to be hard-coded to 172.31.7.0/24, which made one Adjutant stack per
  # host a real constraint: Docker refuses a second network on an overlapping
  # pool, so a second copy of this deployment — or a leftover network from a
  # failed attempt under a different project name — blocked every later `up` with
  # "Pool overlaps with other one on this address space", an error that names
  # none of this. `verify.sh` now checks for that collision first and says which
  # network is in the way.
  edge:
    ipam:
      config:
        - subnet: ${ADJUTANT_EDGE_PREFIX:-172.31.7}.0/24
