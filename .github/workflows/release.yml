name: Release

# Cut a release by pushing a version tag (e.g. `git tag v0.3.0 && git push origin v0.3.0`).
#
# `workflow_dispatch` is here so the pipeline can be **exercised without
# releasing**. A packaging fault otherwise surfaces only at the tag — in the one
# place nothing gates — which is how the tarball shipped eleven plugins short and
# how the Dockerfile shipped three (#88, #118; `docs/release-path.md` Stage 3.10
# asks for exactly this entry). A manual run builds every artifact and uploads
# them as workflow artifacts, and **creates no release**: the release step is
# gated on a tag push.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pinned toolchain, read from `rust-toolchain.toml` — the same step
      # `ci.yml` uses, for the same reason and one more.
      #
      # `dtolnay/rust-toolchain@stable` installs the *stable* toolchain and the
      # target requested below for it. `cargo` then reads `rust-toolchain.toml`
      # and switches to the pinned 1.96.0, which never got the target, so the
      # WASM guest failed with `error[E0463]: can't find crate for core` /
      # "the wasm32-wasip1 target may not be installed". Found by the first
      # `workflow_dispatch` rehearsal of this workflow, before v0.3.0 was tagged.
      #
      # The second reason is the one `ci.yml` records: `@stable` floats forward
      # while the pin stays put, so a tag could ship a binary built by a
      # compiler CI never verified. A release artifact should be built by the
      # toolchain the tests ran on.
      - name: Read the pinned toolchain
        id: toolchain
        run: echo "channel=$(grep -oP '^channel\s*=\s*"\K[^"]+' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --workspace

      - name: Build WASM guest
        run: cargo build --manifest-path wasm/Cargo.toml --release --target wasm32-wasip1

      # The plugin set is **derived, never listed here**. This step used to be
      # three hand-written `cp` lines (hello, auth, membership) while the
      # workspace staged fourteen libraries, so a tarball cut from it would have
      # shipped eleven plugins short — the same defect #88 found in the
      # Dockerfile, in the one file that builds what users download. The list was
      # the bug. `scripts/stage-plugins.py` derives a plugin from `cargo metadata`
      # (a publishable crate that builds a `cdylib`) and exits non-zero when a
      # crate built a library that is not on disk, so the count here cannot drift
      # from the workspace's.
      - name: Stage the plugin libraries (derived from the workspace)
        run: python3 scripts/stage-plugins.py --profile release

      # The client half of the product, built from the same tag. Web is built
      # here because the 161st can open it from anywhere; the Android artifact
      # (the Obtainium path) is attached below, from the same tag.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The same pinned toolchain the gates read (issue #76): two Flutter
          # versions in one repository is two answers to "does it build".
          flutter-version-file: client/pubspec.yaml
          cache: true

      - name: Build the client for the web
        run: flutter build web --release
        working-directory: client

      # The Android half of the client. `--release` and not `--debug`: this is
      # the artifact a scout sideloads (Obtainium), and it is built from the same
      # commit the rest of the tarball is. It is signed with Flutter's throwaway
      # debug key because **nothing we publish is signed until beta** — which
      # means it installs, and that a properly signed build later may not upgrade
      # over it cleanly. README's "Unsigned builds" says the same thing to whoever
      # receives it.
      - name: Build the client for Android (the Obtainium path)
        run: flutter build apk --release
        working-directory: client

      - name: Assert the Android artifact exists and is not a stub
        run: |
          set -euo pipefail
          apk=client/build/app/outputs/flutter-apk/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::$apk was not produced — a tag that attaches no APK is the claim #111 exists to stop"
            exit 1
          fi
          size=$(stat -c %s "$apk")
          echo "app-release.apk is $size bytes"
          # A Flutter release APK for one ABI is tens of MB; anything under a
          # megabyte is an empty shell, and a release nobody can install is worse
          # than a release that says it has none.
          if [ "$size" -lt 1000000 ]; then
            echo "::error::app-release.apk is $size bytes — that is not a client anyone can install"
            exit 1
          fi

      - name: Assemble tarball
        run: |
          set -euo pipefail
          name="adjutant-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$name/plugins"
          cp target/release/adjutant "dist/$name/"
          # Whatever the staging step derived — the assertion below is about this
          # directory not being silently smaller than the workspace again.
          cp plugins-built/*.so "dist/$name/plugins/"
          cp wasm/target/wasm32-wasip1/release/adjutant_hello_wasm.wasm "dist/$name/plugins/"
          cp README.md LICENSE "dist/$name/"
          staged=$(ls plugins-built/*.so | wc -l)
          shipped=$(ls "dist/$name/plugins/"*.so | wc -l)
          if [ "$shipped" -ne "$staged" ] || [ "$shipped" -lt 1 ]; then
            echo "::error::the tarball carries $shipped plugin libraries but $staged were staged"
            exit 1
          fi
          echo "tarball carries $shipped plugin libraries"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Bundle the client for the web
        run: |
          set -euo pipefail
          name="adjutant-client-${GITHUB_REF_NAME}-web"
          tar -C client/build -czf "dist/$name.tar.gz" web
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      # The APK is copied out of the build tree under an artifact name that says
      # which tag and which platform, and given the same `.sha256` as everything
      # else, because it is the one artifact a phone installs and the one nobody
      # can verify by eye.
      - name: Bundle the client for Android
        run: |
          set -euo pipefail
          name="adjutant-client-${GITHUB_REF_NAME}-android"
          cp client/build/app/outputs/flutter-apk/app-release.apk "dist/$name.apk"
          (cd dist && sha256sum "$name.apk" > "$name.apk.sha256")
          ls -l "dist/$name.apk"

      # A manual run's whole point: the artifacts exist somewhere the person who
      # ran it can look at them, without a release having been created.
      - name: Upload the artifacts of a manual run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: adjutant-${{ github.ref_name }}-artifacts
          path: dist/*
          if-no-files-found: error

      # Only a tag creates a release. A dispatch run must never publish.
      - name: Create release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.apk
          generate_release_notes: true
