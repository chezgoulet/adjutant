[package]
name = "adjutant-stripe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Stripe: dues, donations, event fees, and the payment webhook path (SPEC 7.13)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
adjutant-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
# Webhook signature verification is pure CPU — an HMAC over bytes — so it is
# safe to link into a plugin. Anything that needs a runtime or I/O (sqlx,
# reqwest, tokio) is not: see the SDK's host-mediated I/O rule. Outbound HTTP
# goes through `ctx.http`.
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio.workspace = true
# A **dev**-dependency only: it links into the test binaries, never into the
# cdylib, so the plugin's no-runtime-in-the-plugin rule (a plugin reaches the
# database through `ctx.db`, never through sqlx) is untouched. The DB-backed
# probes connect to a real PostgreSQL as this plugin's own role, because
# `core.outbox_enqueue` derives the producer from `session_user` and the whole
# point is to prove what the *plugin's* statement does.
sqlx.workspace = true
