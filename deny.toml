# cargo-deny configuration. Run with `cargo deny check`.
# CI runs this on every push (see .github/workflows/ci.yml).

[graph]
all-features = true

[advisories]
# Fail on known vulnerabilities and yanked crates. Add a scoped, justified
# `ignore` here only with a comment and a linked advisory.
version = 2
yanked = "deny"
ignore = []

[licenses]
# The licenses present in the dependency tree (verified against Cargo.lock).
# Adding a new dependency with a different license requires adding it here
# deliberately.
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
]

[bans]
multiple-versions = "allow"
# Wildcard version requirements are forbidden, but workspace path dependencies
# (the internal crates) are not wildcards.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
