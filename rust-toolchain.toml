# Toolchain for contributors and CI. Pinned to one explicit version so a green
# local run is the same toolchain CI uses. The declared MSRV (1.96, see
# [workspace.package] rust-version) is a separate floor for consumers and is
# verified by the `msrv` CI job — do not confuse the two.
[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
