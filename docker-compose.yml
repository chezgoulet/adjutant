# Adjutant — one-command self-hosted deployment (SPEC §11.1).
#
#   export POSTGRES_PASSWORD="$(openssl rand -hex 24)"
#   export ADJUTANT_APP_PASSWORD="$(openssl rand -hex 24)"
#   docker compose up -d
#
# Postgres is not exposed to the host; only the server is. See docs/deployment.md.
#
# Roles:
#   * `adjutant` — the Postgres superuser, used only for the one-off
#     `bootstrap-isolation` run (it creates roles). The server never connects
#     as it.
#   * `adjutant_app` — the server's runtime role. Created and granted by
#     `bootstrap-isolation --app-role`; no SUPERUSER, no CREATEROLE, owns the
#     `core` schema and holds the plugin roles. This is what makes the
#     superuser boot refusal passable.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      # Admin/bootstrap superuser. The server does not run as it.
      POSTGRES_USER: adjutant
      # Required: no insecure default. Set it in a .env file or the shell.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: adjutant
    volumes:
      # Postgres 18 moved PGDATA into a versioned subdirectory of
      # /var/lib/postgresql, and the image refuses to start if the volume is
      # mounted at the old .../data path: it reports an "unused mount/volume" and
      # exits. Mount the parent and let the image manage its own layout.
      # (Found by running the stack — see the 2026-09-26 finding in
      # docs/release-path.md Stage 3.)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adjutant"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  adjutant:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The server connects as the non-superuser app role; `bootstrap-isolation
      # --app-role adjutant_app` creates it and hands it the core schema. An
      # un-bootstrapped plugin (or app role) makes the server refuse to boot
      # (`NotBootstrapped`, exit 1) — run the bootstrap first.
      ADJUTANT_DATABASE_URL: postgres://adjutant_app:${ADJUTANT_APP_PASSWORD:?set ADJUTANT_APP_PASSWORD}@postgres:5432/adjutant
      ADJUTANT_BIND: 0.0.0.0:8787
      ADJUTANT_LOG_FORMAT: json
      # Leave ADJUTANT_DEV_HEADERS unset (off). Enable only for local dev.
    ports:
      - "8787:8787"
    restart: unless-stopped

volumes:
  pgdata:
