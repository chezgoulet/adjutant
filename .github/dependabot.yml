# Dependabot — the automated half of issue #51's dependency scan.
#
# Scope is decided ecosystem by ecosystem, not copied wholesale:
#
#   * Rust crates — NOT here. `cargo-deny` already runs on every push and every
#     pull request (`.github/workflows/ci.yml`, steps `cargo-deny (root
#     workspace)` and `cargo-deny (wasm workspace)`,
#     `EmbarkStudios/cargo-deny-action@<sha>`, config `deny.toml`) and fails the
#     build on a RustSec advisory or a yanked crate, so both workspaces already
#     have a continuous vulnerability gate. The policy that surrounds it is
#     edited by hand on purpose — the licence allowlist in `deny.toml` says a
#     new licence is a deliberate act — and the toolchain is pinned, so weekly
#     version-bump PRs across ~400 transitive crates would be churn the repo has
#     chosen to avoid rather than a gap.
#
#   * GitHub Actions — here. Every `uses:` in ci.yml and release.yml is pinned
#     to a full commit SHA with the release in a trailing `# vX.Y.Z` comment
#     (#181). That is the integrity pin: a tag can be re-pointed by its owner,
#     a SHA cannot. Dependabot understands this format and updates the SHA and
#     the comment together, which is how the pins stay current without becoming
#     a hand-maintained list. `scripts/check-pins.py` fails the build if the
#     format is broken. `dtolnay/rust-toolchain` remains ignored for the reason
#     under `ignore` below.
#
#   * Flutter / pub — here. `client/pubspec.lock` is committed and the `client`
#     CI job resolves it with `flutter pub get`, but resolving is not auditing:
#     nothing checks it against known vulnerabilities. Dependabot covers it, and
#     its security updates cover it too.
#
# Container base images (the Dockerfile's `rust:`/`debian:` stages, and
# `postgres:18-alpine`, `caddy:2-alpine` and `curlimages/curl:8.22.0` in the
# compose files and the CI service) are now pinned by the linux/amd64
# `@sha256:` digest, with the human tag in a comment (#181). Dependabot's
# `docker` ecosystem is deliberately NOT enabled. Those pins are coupled on
# purpose — the image's `postgresql-client-18` must match the `postgres:18`
# server it dumps, the Rust image must match the declared MSRV, and a bot
# digest bump would silently change a platform manifest without that review —
# so a base-image update is a deliberate hand change, with the coupling in
# view. Acceptable because the digest is the immutability guarantee: the image
# cannot change under us between runs. What is lost is automatic *freshness*,
# not integrity; `scripts/check-pins.py` makes an unpinned image fail, and the
# comment beside each digest names the tag to move to.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # The repository's default branch is `main`, which moves only to cut a
    # release (CONTRIBUTING.md §Git flow); `testing` is the integration branch
    # every PR targets. Without this line Dependabot opens its pull requests
    # against `main` and the repository's own rule is broken by a bot.
    target-branch: "testing"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR a week rather than one per action.
      github-actions:
        patterns: ["*"]
    ignore:
      # `dtolnay/rust-toolchain`'s ref IS the Rust toolchain version, not the
      # action's own semver: `@1.96.0` means "install Rust 1.96.0". Dependabot
      # reads the ref as the action's version and proposes refs like
      # `@1.120.0`, which fails the msrv job with "could not download
      # nonexistent rust version 1.120.0" - that was #136, closed as invalid.
      # The ref is pinned to the crate's `rust-version` deliberately; move it by
      # hand when the MSRV moves. Every other action in the group still updates.
      - dependency-name: "dtolnay/rust-toolchain"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "pub"
    directory: "/client"
    # Same reason as above: `testing`, never `main`.
    target-branch: "testing"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # The client's dependencies are few and small; batch them.
      pub-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "client"
    ignore:
      # A major bump in the client is an integration task, not a drop-in: the
      # app is a thin renderer and majors here are breaking by construction.
      # This filters *version* updates only — Dependabot security updates are a
      # separate path and still open a PR when a vulnerable version is in range,
      # so no fix is hidden.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
