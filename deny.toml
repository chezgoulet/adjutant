# cargo-deny configuration. Run with `cargo deny check`.
# CI runs this on every push (see .github/workflows/ci.yml).

[graph]
all-features = true

[advisories]
# Fail on known vulnerabilities and yanked crates. Add a scoped, justified
# `ignore` here only with a comment and a linked advisory.
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0391: zstd advisories in wasmtime-internal-cache's compilation-cache decompression path. The fix (zstd 0.14.3) is not adoptable: wasmtime 50.0.1, the newest release, still declares zstd ^0.13.0, and 0.14 is a different minor - semver forbids Cargo from crossing it for a 0.x crate. Both cheap overrides are refused by Cargo: `cargo update --precise 0.14.3` fails the requirement, and a version-only [patch.crates-io] errors with 'patches must point to different sources'. The only override is forking zstd or wasmtime-internal-cache, which we decline for code we never execute. Reachability: Adjutant never enables the wasmtime compilation cache (no cache_config or cache_dir in server/src), so the affected path is linked but never run. REVISIT by 2027-01-31, or when wasmtime-internal-cache widens to zstd ^0.14, whichever is sooner.
    { id = "RUSTSEC-2026-0391", reason = "zstd: fix 0.14.3 not adoptable (wasmtime 50.0.1 requires ^0.13.0); path unreachable, cache never enabled. Revisit 2027-01-31 or when wasmtime widens to ^0.14." },
    # RUSTSEC-2026-0398: zstd advisories in wasmtime-internal-cache's compilation-cache decompression path. The fix (zstd 0.14.3) is not adoptable: wasmtime 50.0.1, the newest release, still declares zstd ^0.13.0, and 0.14 is a different minor - semver forbids Cargo from crossing it for a 0.x crate. Both cheap overrides are refused by Cargo: `cargo update --precise 0.14.3` fails the requirement, and a version-only [patch.crates-io] errors with 'patches must point to different sources'. The only override is forking zstd or wasmtime-internal-cache, which we decline for code we never execute. Reachability: Adjutant never enables the wasmtime compilation cache (no cache_config or cache_dir in server/src), so the affected path is linked but never run. REVISIT by 2027-01-31, or when wasmtime-internal-cache widens to zstd ^0.14, whichever is sooner.
    { id = "RUSTSEC-2026-0398", reason = "zstd: fix 0.14.3 not adoptable (wasmtime 50.0.1 requires ^0.13.0); path unreachable, cache never enabled. Revisit 2027-01-31 or when wasmtime widens to ^0.14." },
    # RUSTSEC-2026-0403: zstd advisories in wasmtime-internal-cache's compilation-cache decompression path. The fix (zstd 0.14.3) is not adoptable: wasmtime 50.0.1, the newest release, still declares zstd ^0.13.0, and 0.14 is a different minor - semver forbids Cargo from crossing it for a 0.x crate. Both cheap overrides are refused by Cargo: `cargo update --precise 0.14.3` fails the requirement, and a version-only [patch.crates-io] errors with 'patches must point to different sources'. The only override is forking zstd or wasmtime-internal-cache, which we decline for code we never execute. Reachability: Adjutant never enables the wasmtime compilation cache (no cache_config or cache_dir in server/src), so the affected path is linked but never run. REVISIT by 2027-01-31, or when wasmtime-internal-cache widens to zstd ^0.14, whichever is sooner.
    { id = "RUSTSEC-2026-0403", reason = "zstd: fix 0.14.3 not adoptable (wasmtime 50.0.1 requires ^0.13.0); path unreachable, cache never enabled. Revisit 2027-01-31 or when wasmtime widens to ^0.14." },
]

[licenses]
# The licenses present in the dependency tree (verified against Cargo.lock).
# Adding a new dependency with a different license requires adding it here
# deliberately.
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
]

[bans]
multiple-versions = "allow"
# Wildcard version requirements are forbidden, but workspace path dependencies
# (the internal crates) are not wildcards.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
