[workspace]
resolver = "2"
# The WASM guest crates are a separate workspace (built with
# `--target wasm32-wasip1`); they must not be compiled for the host.
exclude = ["wasm"]
members = [
    "plugins/sdk",
    "plugins/auth",
    "plugins/membership",
    "plugins/missions",
    "plugins/governance",
    "plugins/calendar",
    "plugins/mcp",
    "plugins/finance",
    "plugins/equipment",
    "plugins/archive",
    "plugins/conflicts",
    "plugins/announcements",
    "plugins/stripe",
    "plugins/store",
    "plugins/examples/hello",
    # A test fixture, not a plugin: it must never appear in `libadjutant_*.so`,
    # which is why its package name does not begin with `adjutant-`. The probe in
    # `server/tests/plugin_load_semantics.rs` stages it under a staged name.
    "plugins/examples/broken-init",
    "server",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
# Minimum supported Rust version. wasmtime 49 (the WASM host) requires 1.96;
# that is the binding constraint. Bump only when a dependency (or we) require it.
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/chezgoulet/adjutant"

[workspace.dependencies]
adjutant-sdk = { path = "plugins/sdk", version = "0.2.0" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "process"] }
# Hashing a backup bundle on disk. The audit chain hashes in SQL, so nothing
# needed a Rust digest until the backup runner had to read a file back.
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "macros", "chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", features = ["cors"] }
toml = "0.9"
wasmtime = "49"
wasmtime-wasi = "49"

[profile.dev]
debug = 0  # keep compile times sane for the prototype loop
