[package]
name = "adjutant-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Authentication: local passwords, sessions, OIDC, role assignment (SPEC 7.1). Owns core.users/core.sessions."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
adjutant-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
chrono.workspace = true
# Password hashing + session tokens are pure CPU — no runtime, no I/O — so
# they are safe to link into a plugin (unlike sqlx/reqwest; see SDK docs).
argon2 = { version = "0.5", features = ["password-hash"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
# OIDC id_token verification (HS256 with client_secret, RS256 via JWKS).
# Pure verification — network goes through ctx.http (host-mediated).
jsonwebtoken = "9"

[dev-dependencies]
tokio.workspace = true
# The OIDC tests generate their own RSA key rather than reading a committed PEM:
# a private key in the repository is a private key in the repository, and a
# scanner cannot tell a fixture from a live one.
# 0.9 carries RUSTSEC-2023-0071 (Marvin). `deny.toml` records the scoped
# exception: this is a dev-dependency that only generates a throwaway key inside
# the tests, nothing links it at runtime, and no live key is exposed. If it ever
# becomes a runtime dependency, the ignore goes — not the advisory.
rsa = { version = "0.9", features = ["pem"] }
base64.workspace = true
